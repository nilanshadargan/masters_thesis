[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-assessment"
version = "1.0.0"
description = "Automation of Company Assessment for the Investment Process (MSc thesis): classifying AI startups with BERT and GPT models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nilansha Dargan" }]
license = { text = "MIT" }
keywords = [
    "text-classification",
    "venture-capital",
    "startup-evaluation",
    "bert",
    "chatgpt",
    "few-shot-learning",
]

dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3,<2.0",
    "torch>=2.0,<3.0",
    "transformers>=4.38,<5.0",
    "openai>=1.14,<2.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "tqdm>=4.66,<5.0",
    "nltk>=3.8,<4.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",
]

[project.optional-dependencies]
eda = ["PyPDF2>=3.0,<4.0", "python-docx>=1.1,<2.0"]
dev = ["ruff>=0.4", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
